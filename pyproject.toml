[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milknado"
version = "0.2.1"
description = "Mikado execution engine — decomposes goals into dependency graphs, executes as parallel ralph loops"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "code-review-graph>=2.3.3",
    "fastmcp>=3.3.1",
    "typer>=0.25.1",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "ortools>=9.15.6755",
    "tiktoken>=0.13.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
milknado = "milknado.cli:app"
milknado-mcp = "milknado.mcp_server:main"


[tool.hatch.build.targets.wheel]
packages = ["src/milknado"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: live-API end-to-end tests (claude CLI + ANTHROPIC_API_KEY required; slow)",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "diff-cover>=9.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "ty>=0.0.38",
    "watchfiles>=1.2.0",
]
