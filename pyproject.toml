[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milknado"
version = "0.2.1"
description = "Mikado execution engine — decomposes goals into dependency graphs, executes as parallel ralph loops"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "code-review-graph>=2.3.3",
    "fastmcp>=3.3.1",
    "typer>=0.25.1",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "ortools>=9.15.6755",
    "tiktoken>=0.13.0",
    "tomli-w>=1.0.0",
    "textual>=8.2.8",
    "typing-extensions>=4.14.1",
    "msgspec>=0.21.1",
    "tenacity>=9.1.4",
]

[project.scripts]
milknado = "milknado.cli:app"
milknado-mcp = "milknado.mcp.server:main"


[tool.hatch.build.targets.wheel]
packages = ["src/milknado"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: live-API end-to-end tests (claude CLI + ANTHROPIC_API_KEY required; slow)",
]

[tool.importlinter]
root_package = "milknado"

# Domains are the pure core: they must never import a delivery or application layer.
[[tool.importlinter.contracts]]
name = "domains must not import app, cli, or mcp"
type = "forbidden"
source_modules = ["milknado.domains"]
forbidden_modules = ["milknado.app", "milknado.cli", "milknado.mcp"]

# The graph is a transactional state crust, never an execution-policy consumer.
[[tool.importlinter.contracts]]
name = "graph must not import execution"
type = "forbidden"
source_modules = ["milknado.domains.graph"]
forbidden_modules = ["milknado.domains.execution"]

# The application layer wires domains to delivery; it must not depend on delivery.
[[tool.importlinter.contracts]]
name = "app must not import cli or mcp"
type = "forbidden"
source_modules = ["milknado.app"]
forbidden_modules = ["milknado.cli", "milknado.mcp"]

[[tool.importlinter.contracts]]
name = "execution controller must not import textual presentation"
type = "forbidden"
source_modules = ["milknado.app.run"]
forbidden_modules = ["milknado.app.run_tui"]

# Adapters implement domain ports but must not depend on application policy.
[[tool.importlinter.contracts]]
name = "adapters must not import application policy"
type = "forbidden"
source_modules = ["milknado.adapters"]
forbidden_modules = ["milknado.app"]
[[tool.importlinter.contracts]]
name = "boundary modules must use domain barrels"
type = "forbidden"
source_modules = [
    "milknado.app",
    "milknado.cli",
    "milknado.mcp",
    "milknado.adapters",
]
forbidden_modules = [
    "milknado.domains.batching._model",
    "milknado.domains.batching._tarjan",
    "milknado.domains.dispatch._runstate",
    "milknado.domains.execution._context",
    "milknado.domains.execution.run_loop._completion",
    "milknado.domains.execution.run_loop._logging",
    "milknado.domains.execution.run_loop._result",
    "milknado.domains.github._fields",
    "milknado.domains.github._intent",
    "milknado.domains.graph._analytics_facade",
    "milknado.domains.graph._creation",
    "milknado.domains.graph._edge_facade",
    "milknado.domains.graph._goal_claims",
    "milknado.domains.graph._mutations",
    "milknado.domains.graph._persistence",
    "milknado.domains.graph._pipeline",
    "milknado.domains.graph._reads",
    "milknado.domains.graph._status",
    "milknado.domains.graph._transitions",
    "milknado.domains.wiki._locate",
    "milknado.domains.wiki._serialize",
]
allow_indirect_imports = true


[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP",
    "ANN", "ARG", "BLE", "PTH", "SIM", "B",
    "RUF100", "PLR0913", "PLR0915",
]

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

[tool.ruff.lint.per-file-ignores]
# Tests exercise dynamic fixtures, subprocess doubles, and platform paths rather than
# production annotation and portability policy.
"tests/**" = ["ANN", "ARG", "BLE", "B008", "B017", "PTH", "SIM"]

