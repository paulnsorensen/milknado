# Configures GitHub's automatically-generated release notes.
#
# Reference:
#   https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# When a release is created with `--generate-notes` (CLI) or via the
# "Generate release notes" button, GitHub groups the PRs merged since the
# previous tag into the categories below, driven by each PR's labels.

changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot
      - github-actions
      - renovate

  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - breaking

    - title: Features
      labels:
        - enhancement
        - feature

    - title: Fixes
      labels:
        - bug
        - bugfix
        - fix

    - title: Documentation
      labels:
        - documentation
        - docs

    - title: Dependencies
      labels:
        - dependencies

    - title: Internal
      labels:
        - chore
        - refactor
        - ci
        - build
        - test

    - title: Other changes
      labels:
        - "*"
