# NOTE: The first publish from this workflow will fail. PyPI rejects packages
# with PEP 508 direct-reference deps (git+https://), and pyproject.toml pins
# ralphify via a git direct reference (fork-only features not yet on PyPI).
# Replace that dep with a publishable version constraint before tagging a
# release. Until then, installs use the git fallback documented in the README.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884df5ef57f92f5d27a7d8af7b63fe4b0 # v1.12.4
