name: Windows controller storage

on:
  push:
    branches: [worktree/controller-recovery]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  controller-storage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Run native controller tests
        run: uv run pytest tests/test_controller_startup.py tests/test_windows_controller_storage.py tests/test_windows_merge_lock.py
